<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <title>EduGestión - Gestión de Academias y Tutores</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="assets/isotipo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<script>
  // Theme hydration — runs before Angular to prevent flash
  (function() {
    var mode = localStorage.getItem('edugestion-theme') || 'system';
    var isDark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    if (isDark) document.documentElement.classList.add('dark');
  })();
</script>

<body>
  <app-root></app-root>
</body>

</html>
